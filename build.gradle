plugins {
    id 'application'
    id 'com.gradleup.shadow' version '9.0.0'
}

repositories {
    mavenCentral()
}

// Платформа для сборки: linux (по умолчанию) или win
def targetPlatform = project.findProperty('target') ?: 'linux'

dependencies {
    // ----- JavaFX (нативная платформа через classifier) -----
    implementation "org.openjfx:javafx-base:21.0.8:${targetPlatform}"
    implementation "org.openjfx:javafx-graphics:21.0.8:${targetPlatform}"
    implementation "org.openjfx:javafx-controls:21.0.8:${targetPlatform}"

    // ----- Hibernate + Jakarta Persistence -----
    implementation 'org.hibernate.orm:hibernate-core:6.6.3.Final'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // ----- PostgreSQL -----
    implementation 'org.postgresql:postgresql:42.7.3'

    // ----- Логирование (Hibernate его требует) -----
    implementation 'org.slf4j:slf4j-simple:2.0.13'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'org.ozis.Launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    jvmArgs(
            '-Dfile.encoding=UTF-8',
            '-Dstdout.encoding=UTF-8',
            '-Dstderr.encoding=UTF-8'
    )
}

shadowJar {
    archiveBaseName.set('external-memory')
    archiveClassifier.set(targetPlatform)
    manifest {
        attributes 'Main-Class': 'org.ozis.Launcher'
    }
}
