services:
  postgres:
    image: postgres:18
    container_name: postgresql-database
    environment:
      POSTGRES_DB: externalMemory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker

volumes:
  postgres_data:
